server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:mysql://localhost:3306/overseas_artifacts?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: info

security:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    expire-seconds: 86400

integration:
  # 队友调用 /api/integration/** 时使用的密钥（请求头 X-Integration-Api-Key）
  inbound-api-key: dev-integration-key-change-me

# 知识图谱：直连 Neo4j（管理页「知识图谱管理」使用 /api/admin/kg/**）
kg:
  neo4j:
    enabled: true
    uri: bolt://localhost:7687
    username: neo4j
    password: password123   # 与 graph-db/docker-compose.yml 中 NEO4J_AUTH 一致

backup:
  directory: backups
  # 默认示例 key，请在生产环境替换为你自己的 16/24/32 字节 base64 key
  aes-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
