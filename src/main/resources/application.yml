server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    #本地测试下面这样
    url: jdbc:mysql://localhost:3306/overseas_artifacts?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    #连接公共数据库下面这样 不要随便用，最后再用！！
    # url: jdbc:mysql://47.96.152.190:3306/overseas_chinese_artifacts?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    # username: root        
    # password: "!software2303"     
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: info

security:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    expire-seconds: 86400

integration:
  # 队友调用 /api/integration/** 时使用的密钥（请求头 X-Integration-Api-Key）
  inbound-api-key: dev-integration-key-change-me

# 知识图谱：直连 Neo4j（管理页「知识图谱管理」使用 /api/admin/kg/**）
kg:
  neo4j:
    enabled: true
    #本地测试下面这样 
    # uri: bolt://localhost:7687
    # username: neo4j
    # password: password123   # 与 graph-db/docker-compose.yml 中 NEO4J_AUTH 一致
    # 连接公共图数据库改为下面这样 不要随便用，最后再用！！
    uri: bolt://47.96.152.190:7687
    username: neo4j
    password: "!software2303"   

artifact:
  storage:
    upload-dir: uploads/artifacts
  # 爬虫组图片 API（哈佛 museum_id=2、波士顿 MFA museum_id=3 缩略图）
  image-api:
    enabled: true
    base-url: http://47.96.152.190:8000
    proxy-museum-ids: 2,3

backup:
  directory: backups
  # 默认示例 key，请在生产环境替换为你自己的 16/24/32 字节 base64 key
  aes-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

image-moderation:
  # mock: 本地关键词模拟; real: 阿里云 Green; local: 本地 NSFW ONNX 模型
  mode: local
  provider: aliyun
  aliyun-endpoint: green-cip.cn-shanghai.aliyuncs.com
  aliyun-service: baselineCheck_global
  # 阿里云 AccessKey（mode=real 时需要）
  aliyun-access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
  aliyun-access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
  # 本地 NSFW 模型配置（mode=local 时生效）
  local-model-enabled: true
  local-model-path: models/nsfw_model.onnx
  # 启动时若本地模型文件不存在，自动从此 URL 下载（HuggingFace 国内镜像）
  local-model-download-url: https://hf-mirror.com/onnx-community/nsfw-classifier-ONNX/resolve/main/onnx/model.onnx
